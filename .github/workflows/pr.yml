name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar gradle.properties
        run: cp ci/gradle.properties gradle.properties

      # Mesmo comando do local, sem a etapa da IDE (layout de quebra de linha é só local)
      - name: make format
        run: make format FORMAT_IDE=off

      - name: Falhar se o formatador alterou algo
        run: |
          if ! git diff --exit-code; then
            echo "::error::Rode 'make format' localmente e commite o resultado."
            exit 1
          fi

  build-test:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar gradle.properties
        run: cp ci/gradle.properties gradle.properties

      - name: Testes unitários e build debug
        run: ./gradlew testDevDebugUnitTest assembleDevDebug --stacktrace

      - name: Relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
