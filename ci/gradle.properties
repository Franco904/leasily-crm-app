# Template do gradle.properties do CI: valores fictícios no formato do real.
# O workflow o copia para a raiz antes do Gradle; segredos reais nunca entram aqui.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+EnableDynamicAgentLoading
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

KEYSTORE_FILE=ci-keystore.jks
KEYSTORE_PASSWORD=ci-password
KEY_ALIAS=ci-alias

REMOTE_API_URL="https://api.ci.invalid/"
CLIENT_ID="ci-client-id"
SESSION_COOKIE_NAME="ci_session"

SKIP_AUTH=false

CONTRACT_VERSION=1
